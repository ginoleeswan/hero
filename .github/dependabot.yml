version: 2
updates:
  # JS dependencies — monthly and grouped into as few PRs as possible so a
  # solo maintainer isn't drowned in churn. Expo SDK packages are pinned by
  # `expo install` to the SDK, so ignore their majors here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    # These packages are pinned to the Expo SDK — bump them via `expo install`
    # / an SDK upgrade, NOT Dependabot, or the project desyncs from its SDK
    # (e.g. react-native 0.85→0.86 belongs to SDK 57, jest 30 breaks jest-expo).
    # Dependabot here manages only the SDK-independent deps.
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-*/*'
      - dependency-name: react-test-renderer
      - dependency-name: jest
      - dependency-name: jest-expo
      - dependency-name: eslint-config-expo
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'

  # Keep the GitHub Actions themselves current (addresses the Node 20
  # deprecation warnings on the runner).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
